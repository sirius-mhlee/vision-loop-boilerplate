[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-loop-boilerplate"
version = "0.1.0"
description = "An iterative computer vision pipeline for local images"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML>=6,<7", "Pillow>=12.2,<13"]

[project.optional-dependencies]
autolabel = [
    "fiftyone==1.21.0", "numpy==1.26.4", "opencv-python-headless==4.11.0.86",
    "scipy==1.16.3", "tifffile==2025.5.10", "einops==0.8.2", "pycocotools==2.0.11",
    "setuptools>=77,<81",
]
pipeline = [
    "fiftyone==1.21.0", "rfdetr[train]==1.8.2", "pytorch-lightning==2.6.5",
    "mlflow==3.16.0", "dvc>=3,<4", "ijson>=3.4,<4",
]
dev = ["pytest>=9,<10", "ruff>=0.16,<0.17", "numpy>=1.26,<2", "pycocotools==2.0.11", "ijson>=3.4,<4"]

[project.scripts]
vloop = "vloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vloop.review_plugin" = ["fiftyone.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
