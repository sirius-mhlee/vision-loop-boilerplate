# Penn-Fudan photo-only example: download/extract with the README commands.
# Copy to project.yaml. For your own data, replace image_dir, dataset_name and classes.
# Point to PNGImages, not data/ or PennFudanPed/: annotation masks are also PNGs.
image_dir: data/PennFudanPed/PNGImages
classes:
  - id: 1
    name: person
    prompts: [person]

# Common (relative paths are resolved from this YAML file)
dataset_name: penn-fudan
storage_dir: .vloop
device: cuda:0
seed: 42

# Auto-labeling
sam3_model: segment-anything-3-image-torch
sam3_checkpoint: .vloop/models/sam3/sam3.pt
sam3_source_dir: .vloop/vendor/sam3
sam3_commit: 660a5e9e1b8b4c02c0ad97229b88a09a6e4ff5b7
autolabel_batch_size: 1
autolabel_confidence: 0.5
sam3_precision: bfloat16

# Local services
fiftyone_port: 5151
# Review: bounded startup preparation and incremental background checks
review_prepare_limit: 100
review_audit_batch_size: 100
review_audit_scan_size: 10000
review_poll_seconds: 5
mlflow_port: 5000
dvc_remote: ../vision-loop-dvc-remote

# Training
train_model: RFDETRSegNano
epochs: 30
batch_size: 1
grad_accum_steps: 8
learning_rate: 0.0001
# null downloads official Seg Nano weights into storage_dir/models/rfdetr on first training.
train_checkpoint: null
# Keep COCO indices in one process initially; increase only after measuring RAM use.
train_num_workers: 0
train_gradient_checkpointing: false

# Release / Evaluation
# Default: split manual groups by all three ratios on the first release.
# With release --manual-to-val-test: new manual groups use only val:test (here 1:1).
# Auto-accepted groups stay train-only; actual totals depend on sampling and approval.
split_ratios: [0.8, 0.1, 0.1]
# Optional FiftyOne string field identifying a capture/scene group.
# Also selects review-batch samples by group, before confidence/empty checks.
# null treats each image as its own group; fill metadata before the first review-batch/release.
release_group_field: null
# Final test evaluation still requires explicit --split test.
eval_split: val
# Stored with each trained model; evaluate uses these saved defaults, not later YAML edits.
eval_confidence: 0.001
display_confidence: 0.5
eval_max_detections: 100
